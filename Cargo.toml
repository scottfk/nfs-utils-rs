[workspace]
resolver = "3"
members = ["crates/support", "crates/statd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/scottfk/nfs-utils-rs"
rust-version = "1.88"

[workspace.dependencies]
libc = "0.2"
# The libtirpc subset, from rpcbind-rs (pinned; see the README).
tirpc = { git = "https://github.com/scottfk/rpcbind-rs", rev = "8751f2e98a36cbd1fde958a65465f0506c8c0352" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
